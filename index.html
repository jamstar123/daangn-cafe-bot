<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>쿠팡 앱으로 이동 중...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: #f7f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      color: #111;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #346aff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #666; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 0;
      background-color: #346aff;
      color: #ffffff;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:active { background-color: #2450cc; }
    .footer { margin-top: 18px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>쿠팡 앱으로 이동 중입니다</h2>
    <p>잠시 후 쿠팡 앱 상품 페이지(2번 화면)로 자동 연결됩니다.<br>자동으로 이동하지 않으면 아래 버튼을 눌러주세요.</p>
    <a id="btnGo" class="btn" href="#">쿠팡 앱으로 열기</a>
    <div class="footer">핫딜은 여기 × 쿠팡 파트너스</div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var pId = params.get('p') || '7958974';
      var itemId = params.get('itemId') || '';
      var vendorItemId = params.get('vendorItemId') || '';
      var lptag = params.get('lptag') || 'AF2017901';
      var subid = params.get('subid') || 'daangncafe';

      var itemQuery = '';
      if (itemId) itemQuery += '&itemId=' + encodeURIComponent(itemId);
      if (vendorItemId) itemQuery += '&vendorItemId=' + encodeURIComponent(vendorItemId);

      // 쿠팡 앱 직통 스킴 (장바구니 담기/바로구매 상세 화면 = 2번 화면 직통)
      var appScheme = 'coupang://product?pId=' + encodeURIComponent(pId) + itemQuery;

      // 웹 브라우저 폴백 주소 (파트너스 lptag 포함)
      var webUrl = 'https://www.coupang.com/vp/products/' + encodeURIComponent(pId) + '?lptag=' + encodeURIComponent(lptag) + '&subid=' + encodeURIComponent(subid) + itemQuery;

      document.getElementById('btnGo').href = appScheme;

      // 모바일 환경 감지
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile) {
        // 1. 쿠팡 앱 직통 실행
        window.location.href = appScheme;

        // 2. 앱 미설치 또는 인앱 브라우저 차단 시 웹으로 안전 전환
        setTimeout(function() {
          window.location.replace(webUrl);
        }, 1200);
      } else {
        // 데스크탑 PC에서는 웹 상세페이지로 바로 이동
        window.location.replace(webUrl);
      }
    })();
  </script>
</body>
</html>
